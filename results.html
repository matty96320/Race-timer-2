<style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
import { getFirestore, doc, onSnapshot, getDoc, runTransaction } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

// --- Firebase Instances ---
let app, db, auth;

// --- Global State ---
let raceData = { riders: [], stages: 0, seedingCategories: [], resultsCategories: [] }; 
let raceUnsubscribe = null;
let userId = null, currentRaceId = null, appId = 'enduro-timer-default';
const MAX_RIDERS = 250; 

// --- DOM Elements ---
let raceSearchDiv, raceIdInput, findRaceBtn;
let racePortalDiv, raceNameDisplay, raceIdDisplay, riderCountDisplay;
let signUpForm, resultsTableBody, messageBox;
let tabButtons, tabContents; 
let riderCategorySelect; // seeding
let riderResultsCategorySelect; 
let publicMessageDisplay;

const showMessage = (message, isError = false) => {
if (!messageBox) return;
messageBox.textContent = message;
messageBox.className = `p-3 rounded-md text-center font-semibold mb-4 transition-all duration-300 ${isError ? 'bg-red-500 text-white' : 'bg-green-500 text-white'}`;
messageBox.classList.remove('opacity-0', 'scale-95');
messageBox.classList.add('opacity-100', 'scale-100');
setTimeout(() => {
messageBox.classList.remove('opacity-100', 'scale-100');
messageBox.classList.add('opacity-0', 'scale-95');
}, 4000); 
};

const formatTime = (seconds) => {
if (seconds === 'DNF') return 'DNF';
if (seconds === null || typeof seconds !== 'number') return 'N/A';
const h = Math.floor(seconds / 3600);
const m = Math.floor((seconds % 3600) / 60);
const s = Math.floor(seconds % 60);
const format = (val) => val.toString().padStart(2, '0');
return `${format(h)}:${format(m)}:${format(s)}`;
};

const getProvisionalData = (rider) => {
const completedTimes = rider.times.filter(t => typeof t === 'number');
return { stagesCompleted: completedTimes.length, provisionalTime: completedTimes.reduce((a, b) => a + b, 0) };
};

const setupTabs = () => {
tabButtons = document.querySelectorAll('.tab-button');
tabContents = document.querySelectorAll('.tab-content');

tabButtons.forEach(button => {
button.addEventListener('click', () => {
tabButtons.forEach(btn => btn.classList.remove('active'));
button.classList.add('active');

tabContents.forEach(content => content.classList.add('hidden'));
const tabId = button.dataset.tab;
if(tabId) {
const contentEl = document.getElementById(tabId);
if (contentEl) contentEl.classList.remove('hidden');
}
});
});
if(tabButtons.length > 0) tabButtons[0].click();
};

const populateSeedingCategoryDropdown = () => {
if (!riderCategorySelect) return;
riderCategorySelect.innerHTML = '<option value="">-- No Category --</option>';
raceData.seedingCategories.forEach(category => {
const option = document.createElement('option');
option.value = category;
option.textContent = category;
riderCategorySelect.appendChild(option);
});
};

const populateResultsCategoryDropdown = () => {
if (!riderResultsCategorySelect) return;
riderResultsCategorySelect.innerHTML = '<option value="">-- No Category --</option>';
raceData.resultsCategories.forEach(category => {
const option = document.createElement('option');
option.value = category;
option.textContent = category;
riderResultsCategorySelect.appendChild(option);
});
};

const setupResultsListener = (raceId) => {
if (raceUnsubscribe) raceUnsubscribe();
currentRaceId = raceId;
const raceDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'races', raceId);

raceUnsubscribe = onSnapshot(raceDocRef, (docSnap) => {
if (docSnap.exists()) {
raceData = docSnap.data();
if (!raceData.seedingCategories) raceData.seedingCategories = [];
if (!raceData.resultsCategories) raceData.resultsCategories = []; 

raceNameDisplay.textContent = raceData.raceName || 'Race';
raceIdDisplay.textContent = `Race ID: ${raceId}`;
riderCountDisplay.textContent = `Riders: ${raceData.riders.length}/${MAX_RIDERS}`; 
renderResults();
populateSeedingCategoryDropdown(); 
populateResultsCategoryDropdown(); 

if (publicMessageDisplay && raceData.raceMessage && raceData.raceMessage.trim() !== '') {
publicMessageDisplay.textContent = raceData.raceMessage;
publicMessageDisplay.classList.remove('hidden');
publicMessageDisplay.classList.add('bg-blue-100', 'text-blue-800', 'border', 'border-blue-200');
} else if (publicMessageDisplay) {
publicMessageDisplay.classList.add('hidden');
publicMessageDisplay.textContent = '';
}

} else {
showMessage('The race you were viewing seems to have been deleted.', true);
showSearch();
}
}, (error) => {
console.error("Error listening: ", error);
showMessage('Lost connection to race results.', true);
});
};

const renderResults = () => {
/* unchanged – same as original */
 /* ... (kept exactly the same as your original code) */
};

const findRace = async () => {
/* unchanged */
};

const showSearch = () => {
/* unchanged */
};

const handleSignUp = async (event) => {
event.preventDefault();
if (!currentRaceId) return showMessage('No race loaded.', true);

const riderName = document.getElementById('riderName').value.trim();
const riderSeedingCategory = riderCategorySelect.value; 
const riderResultsCategory = riderResultsCategorySelect.value;

if (!riderName) return showMessage('Please enter your full name.', true); 
// Results category is now optional – removed the requirement check

const raceDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'races', currentRaceId);
let assignedRiderNumber = null; 

try {
await runTransaction(db, async (transaction) => {
const raceSnap = await transaction.get(raceDocRef);
if (!raceSnap.exists()) throw "Race document does not exist!";

const currentData = raceSnap.data();
const currentRiders = currentData.riders || [];
const currentStages = currentData.stages || 0;

let newRiderNumber = 1;
if (currentRiders.length > 0) {
const maxNumber = Math.max(...currentRiders.map(r => r.number));
newRiderNumber = maxNumber + 1;
}
assignedRiderNumber = newRiderNumber; 

if (currentRiders.length >= MAX_RIDERS) throw `Race is full (${MAX_RIDERS} rider limit).`;

const newRider = { 
number: newRiderNumber, 
name: riderName, 
seedingCategory: riderSeedingCategory, 
resultsCategory: riderResultsCategory, 
times: Array(currentStages).fill(null),
totalTime: null, 
status: 'active' 
};

const updatedRiders = [...currentRiders, newRider];
transaction.update(raceDocRef, { riders: updatedRiders });
});

showMessage(`Successfully signed up! Your rider number is #${assignedRiderNumber}.`, false);
signUpForm.reset();
} catch (e) {
console.error("Sign-up failed: ", e);
showMessage(`Sign-up failed: ${e.toString()}`, true);
}
};

/* the rest of the script (DOMContentLoaded, Firebase init, event listeners) is unchanged */
window.addEventListener('DOMContentLoaded', () => {
raceSearchDiv = document.getElementById('raceSearch');
raceIdInput = document.getElementById('raceIdInput');
findRaceBtn = document.getElementById('findRaceBtn');
racePortalDiv = document.getElementById('racePortal');
raceNameDisplay = document.getElementById('raceNameDisplay');
raceIdDisplay = document.getElementById('raceIdDisplay');
riderCountDisplay = document.getElementById('riderCountDisplay');
signUpForm = document.getElementById('signUpForm');
resultsTableBody = document.getElementById('resultsTableBody');
messageBox = document.getElementById('messageBox');
riderCategorySelect = document.getElementById('riderCategorySelect'); 
riderResultsCategorySelect = document.getElementById('riderResultsCategorySelect');
publicMessageDisplay = document.getElementById('publicMessageDisplay'); 

// Firebase init unchanged …

findRaceBtn.addEventListener('click', findRace);
signUpForm.addEventListener('submit', handleSignUp);
document.getElementById('backToSearchBtn').addEventListener('click', showSearch);
});
</script>
